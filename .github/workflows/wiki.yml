name: Publish API Reference to Wiki

on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: publish-api-reference
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Update wiki to latest
        run: git submodule update --remote wiki/asl-help.wiki

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore

      - name: Generate wiki
        run: dotnet msbuild wiki/generate.proj

      - name: Publish
        working-directory: wiki/asl-help.wiki
        shell: bash
        run: |
          git add -A
          git diff --cached --quiet && { echo "No wiki changes to publish."; exit 0; }
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Regenerate wiki from ${GITHUB_SHA::7}"
          git push origin HEAD:master
